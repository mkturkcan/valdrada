site_name: Valdrada
site_url: https://mkturkcan.github.io/valdrada/
site_description: >-
  A digital twin simulator of New York City and an explicit world model of it, compiled from public records:
  real-time rendering in the browser and Unreal Engine 5, simulated traffic and pedestrians, pixel-exact ground truth,
  sim-to-real control channels and a Python API.
site_author: M. K. Turkcan
repo_url: https://github.com/mkturkcan/valdrada
repo_name: mkturkcan/valdrada
edit_uri: ""
copyright: Code MIT, documentation CC BY 4.0, compiled city ODbL 1.0. Data © NYC Open Data, NY State open data and OpenStreetMap contributors.

docs_dir: docs
exclude_docs: |
  api/RELEASE_README.md
  techniques.md
  interior-mapping.md
  typology/
  specs/
  hooks/
  overrides/
  assets/figures/raw/
  assets/figures/maps/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  logo: assets/figures/logo.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/figures/favicon.svg

extra_css:
  - stylesheets/extra.css

hooks:
  - docs/hooks/repo_links.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info

nav:
  - Home: index.md
  - Media: media.md
  - Guide:
      - Quick start: quickstart.md
      - Installation: install.md
      - Getting started: api/getting_started.md
      - Data collection: data-collection.md
      - Renderer architecture: architecture.md
      - Rendering in Blender Cycles: blender-cycles.md
      - Rendering in Unreal Engine 5: unreal.md
      - Unreal Engine 5 client: ue-client.md
      - Building the Unreal Engine 5 client: ue-client-build.md
      - Interactive client: client.md
      - Building from source: building.md
      - Development and quality checks: development.md
  - Tutorials:
      - tutorials/index.md
      - First steps: tutorials/first-steps.md
      - Cameras: tutorials/cameras.md
      - Semantic and instance segmentation: tutorials/segmentation.md
      - Depth: tutorials/depth.md
      - Bounding boxes: tutorials/bounding-boxes.md
      - Recording a dataset: tutorials/recording-a-dataset.md
      - Controlling actors: tutorials/controlling-actors.md
  - Reference:
      - Python API: api/python_api.md
      - Wire protocol: api/protocol.md
  - Data:
      - Licensing: licensing.md
      - Data sources: data-sources.md
      - Acknowledgements: acknowledgements.md
      - Citation: citation.md
