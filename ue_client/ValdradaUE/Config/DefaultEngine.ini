; ValdradaUE: the renderer client of the headless core. The renderer settings are BoundlessUE's (the take renderer's
; project, client/tools/ar34/export/ue_project), so the city's materials compile to the same shaders and share the cache.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Client/Maps/City
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/ValdradaRender.ValdradaGameMode

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
r.Nanite.ProjectEnabled=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.AllowStaticLighting=False
r.RayTracing=True
r.RayTracing.Shadows=False
r.Lumen.HardwareRayTracing=True
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=1
r.Lumen.TraceMeshSDFs=1
r.MegaLights.EnableForProject=True
r.SkinCache.CompileShaders=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=1.0
r.DefaultFeature.LocalExposure.ShadowContrastScale=1.0
r.CustomDepth=3
r.VirtualTextures=False
r.SupportSkyAtmosphere=True
r.Substrate=False

[SystemSettings]
; the take renderer's cinematic preset (tools/ue/render_take_cine2g.json), less what only offline frames afford
r.Nanite.Streaming.StreamingPoolSize=1024
r.ViewDistanceScale=4.0
r.StaticMeshLODDistanceScale=0.25
foliage.LODDistanceScale=4.0
r.Lumen.HardwareRayTracing=1
r.Lumen.Reflections.HardwareRayTracing=1
r.RayTracing.Geometry.SkeletalMeshes=0
r.RayTracing.Geometry.StaticMeshes.WPO=0
r.RayTracing.Geometry.InstancedStaticMeshes.EvaluateWPO=0
r.RayTracing.Geometry.NaniteProxies.WPO=0
r.RayTracing.Nanite.Mode=1
r.RayTracing.Culling=1
r.RayTracing.Culling.Angle=0.05
r.RayTracing.Culling.Radius=100000
r.Tonemapper.Sharpen=0.5
r.EyeAdaptation.PreExposureOverride=1
; every component drawn from its first frame, its PSOs compiled at the first draw (a hitch) rather than its proxy held
; until they are precached: the cooked 0.7.0 client drew no vehicle, walker or id copy for its first two minutes
r.PSOPrecache.ProxyCreationStrategy=0
r.MotionBlurQuality=0
; the take renderer's stability settings (GPU hangs under the front layer of translucency and async compute, R4/R5)
r.RDG.AsyncCompute=0
r.Lumen.TranslucencyReflections.FrontLayer.Enable=0
r.MegaLights.Allow=0
r.Nanite.MaxCandidatePatches=8388608
r.Nanite.MaxVisiblePatches=8388608
r.Shadow.Virtual.Nanite.AllowTessellationDirectional=0
r.Shadow.Virtual.Nanite.AllowTessellationLocal=0

[/Script/Engine.Engine]
NearClipPlane=10.0
bSmoothFrameRate=False

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True

[DevOptions.Shaders]
NumUnusedShaderCompilingThreads=4

[/Script/UnrealEd.CookerSettings]
bCookOnTheFlyForLaunchOn=False
